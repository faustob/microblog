<script type="module">
  import {onLCP, onINP} from 'https://unpkg.com/web-vitals@4?module';

  function sendToServer(metric) {
    try {
      const body = JSON.stringify({
        name: metric.name,
        value: metric.value,
        route: window.location.pathname
      });
      const url = '/api/vitals';
      if (navigator.sendBeacon) {
        navigator.sendBeacon(url, body);
      } else {
        fetch(url, {body, method: 'POST', keepalive: true, headers: {'Content-Type': 'application/json'}});
      }
    } catch (e) {
      // never let RUM reporting break the page
    }
  }

  onLCP(sendToServer);
  onINP(sendToServer);
</script>
